# This workflow allows running additional CI on a pull request by commenting:
#
#   /test nightly
#   /test nightly-release
#   /test zephyr <run-id>
#
# where <run-id> is the ID of a workflow run in this repository that built the
# Linux x86_64 toolchain to test (e.g. a premerge or nightly run). To run more
# than one check, post one comment per check.
#
# Only users with write access to the repository may trigger checks, and only
# for pull requests whose branch lives in this repository. The triggering
# comment is updated with a link to the run and, once finished, the results.
#
# Requesting a check again on the same pull request cancels any in-progress run
# of that check.

name: PR Comment Checks
run-name: "PR comment checks #${{ github.event.issue.number }}"

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  parse:
    if: >-
      github.repository == 'qualcomm/cpullvm-toolchain' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/test ')
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    outputs:
      sha: ${{ steps.parse.outputs.sha }}
      check: ${{ steps.parse.outputs.check }}
      toolchain_run_id: ${{ steps.parse.outputs.toolchain_run_id }}
    steps:
      - name: Parse request
        id: parse
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const comment = context.payload.comment;
            const appendToComment = note => github.rest.issues.updateComment({
              owner, repo, comment_id: comment.id,
              body: `${comment.body}\n\n> _${note}_`,
            });
            const reject = async reason => {
              await appendToComment(`Not running check: ${reason}`);
              core.setFailed(reason);
            };

            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner, repo, username: comment.user.login,
            });
            if (!['admin', 'write'].includes(perm.permission)) {
              return reject(`@${comment.user.login} does not have write access.`);
            }

            const usage = {
              'nightly': '/test nightly',
              'nightly-release': '/test nightly-release',
              'zephyr': '/test zephyr <run-id>',
            };
            const [check, ...args] = comment.body.split(/\r?\n/)[0].trim().split(/\s+/).slice(1);
            if (!Object.hasOwn(usage, check)) {
              return reject(`expected one of: ${Object.values(usage).map(u => `\`${u}\``).join(', ')}.`);
            }

            // Only zephyr takes an argument: the ID of the run that built the
            // toolchain.
            // FIXME: It might be good to make this optional and default to the
            // toolchain from the linux-premerge.yml run for the PR's head SHA.
            const toolchainRunId =
              (check === 'zephyr' && args.length === 1 && /^\d+$/.test(args[0])) ? args[0] : '';
            if (check === 'zephyr' ? !toolchainRunId : args.length) {
              return reject(`expected \`${usage[check]}\`.`);
            }

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.issue.number,
            });
            if (pr.head.repo?.full_name !== `${owner}/${repo}`) {
              return reject('pull requests from forks are not supported.');
            }

            core.setOutput('sha', pr.head.sha);
            core.setOutput('check', check);
            core.setOutput('toolchain_run_id', toolchainRunId);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const toolchain = toolchainRunId ? ` with the toolchain from run ${toolchainRunId}` : '';
            await appendToComment(`Running ${check} on ${pr.head.sha}${toolchain} in ${runUrl}`);

  nightly:
    needs: parse
    if: needs.parse.outputs.check == 'nightly'
    concurrency:
      group: pr-comment-checks-${{ github.event.issue.number }}-nightly
      cancel-in-progress: true
    uses: ./.github/workflows/nightly.yml
    with:
      ref: ${{ needs.parse.outputs.sha }}

  nightly-release:
    needs: parse
    if: needs.parse.outputs.check == 'nightly-release'
    concurrency:
      group: pr-comment-checks-${{ github.event.issue.number }}-nightly-release
      cancel-in-progress: true
    uses: ./.github/workflows/nightly.yml
    with:
      ref: ${{ needs.parse.outputs.sha }}
      enable_assertions: false

  zephyr:
    needs: parse
    if: needs.parse.outputs.check == 'zephyr'
    concurrency:
      group: pr-comment-checks-${{ github.event.issue.number }}-zephyr
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/zephyr-twister-tests.yml
    with:
      run-id: ${{ needs.parse.outputs.toolchain_run_id }}

  report:
    needs: [parse, nightly, nightly-release, zephyr]
    if: always() && needs.parse.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Add results to the comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
          CHECK: ${{ needs.parse.outputs.check }}
          SHA: ${{ needs.parse.outputs.sha }}
          TOOLCHAIN_RUN_ID: ${{ needs.parse.outputs.toolchain_run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const check = process.env.CHECK;
            const result = JSON.parse(process.env.NEEDS)[check].result;
            const icons = { success: '✅', failure: '❌', cancelled: '⚪' };
            const toolchain = process.env.TOOLCHAIN_RUN_ID
              ? ` with the toolchain from run ${process.env.TOOLCHAIN_RUN_ID}` : '';
            const note = `${icons[result] ?? '❔'} \`${check}\` ${result} for ${process.env.SHA}${toolchain}.`;

            // Re-read the comment, since it was updated by the parse job.
            const { data: comment } = await github.rest.issues.getComment({
              owner, repo, comment_id: context.payload.comment.id,
            });
            await github.rest.issues.updateComment({
              owner, repo, comment_id: comment.id,
              body: `${comment.body}\n\n${note}`,
            });
